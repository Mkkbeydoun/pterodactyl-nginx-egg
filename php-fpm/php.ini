; PHP settings for this server. Loaded on top of the image's stock php.ini,
; so only list what you want to change. Restart the server to apply.

memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Keep in line with client_max_body_size in nginx/conf.d/default.conf
upload_max_filesize = 100M
post_max_size = 100M

; Uploads and sessions on the server disk (the container's /tmp is a small RAM disk that
; is wiped on every restart). start.sh creates both folders.
upload_tmp_dir = /home/container/tmp
session.save_path = "/home/container/sessions"

date.timezone = UTC
expose_php = Off

display_errors = Off
log_errors = On
error_log = /home/container/logs/php-error.log
